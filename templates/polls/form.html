{% extends "base.html" %}
{% block title %}{{ (t.edit_poll if poll else t.new_poll) }} — {{ brand_name }}{% endblock %}

{% block content %}
<div class="container">
    <h1>{{ t.edit_poll if poll else t.new_poll }}</h1>

    <form method="POST" id="poll-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="title">{{ t.poll_title }} *</label>
            <input type="text" id="title" name="title" required
                   value="{{ poll.title if poll else '' }}">
        </div>

        <div class="form-group">
            <label for="description">{{ t.poll_description }}</label>
            <textarea id="description" name="description" rows="2">{{ poll.description if poll else '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="duration">{{ t.duration }}</label>
            <select id="duration" name="duration">
                {% set dur = poll.duration if poll else 60 %}
                <option value="15" {{ 'selected' if dur == 15 }}>15 {{ t.duration_minutes }}</option>
                <option value="30" {{ 'selected' if dur == 30 }}>30 {{ t.duration_minutes }}</option>
                <option value="60" {{ 'selected' if dur == 60 }}>1 {{ t.duration_hour }}</option>
                <option value="90" {{ 'selected' if dur == 90 }}>1,5 {{ t.duration_hours }}</option>
                <option value="120" {{ 'selected' if dur == 120 }}>2 {{ t.duration_hours }}</option>
                <option value="150" {{ 'selected' if dur == 150 }}>2,5 {{ t.duration_hours }}</option>
                <option value="180" {{ 'selected' if dur == 180 }}>3 {{ t.duration_hours }}</option>
            </select>
        </div>

        <div class="form-group">
            <label>{{ t.poll_options }} * <span class="hint">{{ t.click_to_add }}</span></label>

            <!-- Calendar week view -->
            <div class="calendar-nav">
                <button type="button" id="cal-prev" class="btn btn-sm btn-outline">&larr; {{ t.prev_week }}</button>
                <span id="cal-week-label" class="cal-week-label"></span>
                <button type="button" id="cal-today" class="btn btn-sm btn-outline">{{ t.today }}</button>
                <button type="button" id="cal-next" class="btn btn-sm btn-outline">{{ t.next_week }} &rarr;</button>
            </div>

            <div class="calendar-grid-wrapper">
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Generated by JS -->
                </div>
            </div>

            <!-- Selected slots summary -->
            <div class="selected-slots" id="selected-slots">
                <div class="selected-slots-header">
                    <strong>{{ t.selected_slots }}</strong>
                    <button type="button" id="clear-slots" class="btn btn-sm btn-outline">{{ t.clear_all }}</button>
                </div>
                <div id="slots-list" class="slots-list">
                    <p class="empty-state-sm">{{ t.no_slots_selected }}</p>
                </div>
            </div>

            <input type="hidden" name="slots_json" id="slots-json" value="">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ t.update_poll if poll else t.create_poll }}</button>
            <a href="{{ url_for('polls.index') }}" class="btn btn-outline">{{ t.cancel }}</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    const T = {
        no_slots: '{{ t.no_slots_selected }}',
        hours: '{{ t.hours }}'
    };

    // Existing slots (edit mode) — server stores UTC, convert to local
    let selectedSlots = [];
    {% if poll and poll.options %}
    selectedSlots = [
        {% for opt in poll.options %}
        '{{ opt.datetime.strftime("%Y-%m-%dT%H:%M") }}Z',
        {% endfor %}
    ].map(function(utc) { return utcToLocalSlot(utc); });
    {% endif %}

    const grid = document.getElementById('calendar-grid');
    const slotsJson = document.getElementById('slots-json');
    const slotsList = document.getElementById('slots-list');
    const durationSelect = document.getElementById('duration');

    let weekOffset = 0;

    // In edit mode, navigate to the week of the first existing slot
    if (selectedSlots.length > 0) {
        var firstSlotDate = new Date(selectedSlots[0]);
        var now = new Date();
        var firstMonday = getMonday2(firstSlotDate);
        var currentMonday = getMonday2(now);
        weekOffset = Math.round((firstMonday - currentMonday) / (7 * 86400000));
    }

    function getMonday2(date) {
        var d = new Date(date);
        var day = d.getDay();
        var diff = d.getDate() - day + (day === 0 ? -6 : 1);
        d.setDate(diff);
        d.setHours(0, 0, 0, 0);
        return d;
    }

    function getMonday(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        d.setDate(diff);
        d.setHours(0, 0, 0, 0);
        return d;
    }

    function formatDate(d) {
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        return dd + '.' + mm;
    }

    function formatDateISO(d) {
        const y = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return y + '-' + mm + '-' + dd;
    }

    function dayNames() {
        const lang = '{{ lang }}';
        if (lang === 'de') return ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
        return ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    }

    function getDuration() {
        return parseInt(durationSelect.value) || 60;
    }

    function renderCalendar() {
        const now = new Date();
        const monday = getMonday(now);
        monday.setDate(monday.getDate() + weekOffset * 7);

        const days = dayNames();
        const duration = getDuration();
        const slotsPerHour = 60 / Math.min(duration, 60);
        const startHour = 7;
        const endHour = 21;

        // Week label
        const sunday = new Date(monday);
        sunday.setDate(sunday.getDate() + 6);
        document.getElementById('cal-week-label').textContent =
            formatDate(monday) + ' — ' + formatDate(sunday) + '.' + sunday.getFullYear();

        let html = '<div class="cal-header-cell cal-time-col"></div>';
        for (let d = 0; d < 7; d++) {
            const day = new Date(monday);
            day.setDate(day.getDate() + d);
            const isToday = formatDateISO(day) === formatDateISO(now);
            html += '<div class="cal-header-cell' + (isToday ? ' cal-today' : '') + '">' +
                    days[d] + '<br><span class="cal-date-num">' + formatDate(day) + '</span></div>';
        }

        const step = 15; // always 15-minute grid
        for (let h = startHour; h < endHour; h++) {
            for (let s = 0; s < 4; s++) {
                const minute = s * step;
                const timeStr = String(h).padStart(2, '0') + ':' + String(minute).padStart(2, '0');

                html += '<div class="cal-time-cell cal-time-col">' +
                        (minute === 0 ? timeStr : '') + '</div>';

                for (let d = 0; d < 7; d++) {
                    const day = new Date(monday);
                    day.setDate(day.getDate() + d);
                    const slotKey = formatDateISO(day) + 'T' + timeStr;
                    const isSelected = selectedSlots.indexOf(slotKey) !== -1;
                    const isPast = day < now && formatDateISO(day) !== formatDateISO(now);

                    let cellContent = '';
                    if (isSelected) {
                        const endMin = minute + duration;
                        const endH = h + Math.floor(endMin / 60);
                        const endM = endMin % 60;
                        cellContent = timeStr + '–' +
                            String(endH).padStart(2, '0') + ':' + String(endM).padStart(2, '0');
                    }

                    html += '<div class="cal-cell' +
                            (isSelected ? ' cal-selected' : '') +
                            (isPast ? ' cal-past' : '') +
                            '" data-slot="' + slotKey + '">' + cellContent + '</div>';
                }
            }
        }

        grid.style.gridTemplateColumns = '50px repeat(7, 1fr)';
        grid.innerHTML = html;
    }

    function updateSlotsUI() {
        selectedSlots.sort();
        slotsJson.value = JSON.stringify(selectedSlots);

        if (selectedSlots.length === 0) {
            slotsList.innerHTML = '<p class="empty-state-sm">' + T.no_slots + '</p>';
            return;
        }

        const duration = getDuration();
        let html = '';
        selectedSlots.forEach(function(slot) {
            const d = new Date(slot);
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            const hh = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');

            const endDate = new Date(d.getTime() + duration * 60000);
            const ehh = String(endDate.getHours()).padStart(2, '0');
            const emin = String(endDate.getMinutes()).padStart(2, '0');

            html += '<span class="slot-tag">' +
                    dd + '.' + mm + '.' + yyyy + ' ' +
                    hh + ':' + min + '–' + ehh + ':' + emin +
                    ' <button type="button" class="slot-remove" data-slot="' + slot + '">&times;</button>' +
                    '</span>';
        });
        slotsList.innerHTML = html;
    }

    function toggleSlot(slotKey) {
        const idx = selectedSlots.indexOf(slotKey);
        if (idx !== -1) {
            selectedSlots.splice(idx, 1);
        } else {
            selectedSlots.push(slotKey);
        }
        updateSlotsUI();
        renderCalendar();
    }

    // Event: click on calendar cell
    grid.addEventListener('click', function(e) {
        const cell = e.target.closest('.cal-cell');
        if (cell && !cell.classList.contains('cal-past')) {
            toggleSlot(cell.dataset.slot);
        }
    });

    // Event: remove slot tag
    slotsList.addEventListener('click', function(e) {
        if (e.target.classList.contains('slot-remove')) {
            toggleSlot(e.target.dataset.slot);
        }
    });

    // Event: clear all
    document.getElementById('clear-slots').addEventListener('click', function() {
        selectedSlots = [];
        updateSlotsUI();
        renderCalendar();
    });

    // Event: week navigation
    document.getElementById('cal-prev').addEventListener('click', function() {
        weekOffset--;
        renderCalendar();
    });
    document.getElementById('cal-next').addEventListener('click', function() {
        weekOffset++;
        renderCalendar();
    });
    document.getElementById('cal-today').addEventListener('click', function() {
        weekOffset = 0;
        renderCalendar();
    });

    // Event: duration change re-renders calendar
    durationSelect.addEventListener('change', function() {
        updateSlotsUI();
        renderCalendar();
    });

    // Convert local slots to UTC before form submission
    document.getElementById('poll-form').addEventListener('submit', function() {
        var utcSlots = selectedSlots.map(function(slot) {
            return localToUtcSlot(slot);
        });
        slotsJson.value = JSON.stringify(utcSlots);
    });

    // Init
    renderCalendar();
    updateSlotsUI();
})();
</script>
{% endblock %}
